01-overview.png:
  cs: Sledujte aktivní problémy v nastavitelné tabulce dashboardu s počty závažností, flexibilními sloupci a přímým potvrzováním.
  en: Review active problems in a configurable dashboard table with severity counters, flexible columns and direct acknowledgement actions.
02-problems.png:
  cs: Dvacet jedna otevřených problémů na osmi hostech seřazených podle závažnosti, s počty po závažnostech v souhrnném řádku.
  en: Twenty-one open problems across eight hosts, sorted by severity, with the per-severity counters in the summary row.
03-action-buttons.png:
  cs: "Akční tlačítka (PRO): po kliknutí pravým tlačítkem na problém se pod vestavěnými akcemi nabídnou tlačítka, která nadefinoval administrátor."
  en: "Action buttons (PRO): right-click a problem and the administrator's own buttons appear under the built-in actions."
04-administration.png:
  cs: "Administrace -> Enhanced Problems: jedno akční tlačítko od začátku do konce - URL, hlavičky, tělo, potvrzení a čtení z odpovědi."
  en: "Administration -> Enhanced Problems: one action button end to end - URL, headers, body, confirmation and reading from the response."
06-settings.png:
  cs: 'Nastavení widgetu: titulní blok, filtrování, sloupce, řazení a souhrnný řádek.'
  en: 'Widget configuration: title block, filtering, columns, sorting and the summary row.'
